<!--! Botón para abrir el modal -->
<div class="container mx-auto my-8">
    <!--! Botoooon -->
    <button id="openModalBtn" class="button">
        Abrir Modal
    </button>
</div>

<!--! Modal (oculto por defecto) -->
<div id="crud-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/85 ">
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-md relative">
        <!-- Botón de cierre -->
        <button id="closeModalBtn" class="absolute top-2 right-2 text-gray-500 text-2xl">&times;</button>
        <!-- Título del modal -->
        <h3 class="text-lg font-semibold mb-4">Crear / Editar Empleado</h3>
        <hr class="mb-4 border-gray-500">
        <!-- Formulario -->
        <form id="productForm" class="grid gap-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-900">Nombre</label>
                <input type="text" id="name" required placeholder="Escribe el nombre"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
                <label for="cargo" class="block text-sm font-medium text-gray-900">Cargo</label>
                <select id="category" name="cargo"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
                    <option value="">Selecciona cargo del empleado</option>
                    <option value="Cajero">Cajero</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Mesero">Mesero</option>
                    <option value="Cocinero">Cocinero</option>
                    <option value="Repartidor">Repartidor</option>
                </select>
            </div>
            <div>
                <label for="salario" class="block text-sm font-medium text-gray-900">Salario</label>
                <input type="number" id="salario" name="salario" required placeholder="Ej. 2000000"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
                <label for="telefono" class="block text-sm font-medium text-gray-900">Telefono</label>
                <input type="text" id="telefono" name="telefono" required placeholder="Ej. 3001234567"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-900">Email</label>
                <input type="email" id="email" required placeholder="Ej. daniel@gmail.com"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
            </div>

            <!--! Campos para otro modal -->
            <!-- Campos para otro modal
            <div>
                <label for="category" class="block text-sm font-medium text-gray-900">Categoría</label>
                <select id="category"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
                    <option value="">Selecciona categoría</option>
                    <option value="TV">TV/Monitores</option>
                    <option value="PC">PC</option>
                    <option value="GA">Gaming/Console</option>
                    <option value="PH">Phones</option>
                </select>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-900">Descripción</label>
                <textarea id="description" rows="4" placeholder="Escribe la descripción del producto"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"></textarea>
            </div>
            <!--! Campos para otro modal -->


            <button type="submit" class="button">
                <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                        clip-rule="evenodd"></path>
                </svg>
                Guardar Empleado
            </button>
        </form>
    </div>
</div>

<!--! Código JavaScript -->
<script>
    // Elementos del DOM
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('crud-modal');

    // Función para abrir el modal
    openModalBtn.addEventListener('click', () => {
        modal.classList.remove('hidden');
    });

    // Función para cerrar el modal
    closeModalBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        resetForm();
    });

    // Cerrar el modal al hacer clic fuera del contenido
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.add('hidden');
            resetForm();
        }
    });



</script>
</>
