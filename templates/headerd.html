<header class="relative z-50">
    <!-- Navbar Responsive -->
    <div class="relative flex items-center justify-between py-4 px-4 sm:px-6 bg-white">

        <!-- Logo con ajuste responsive -->
        <div
            class="flex flex-row justify-center items-center font-roboto text-xl sm:text-2xl md:text-3xl font-semibold tracking-wide">
            <img class="h-auto w-10 sm:w-12 md:w-16 object-contain"
                src="{{ url_for('static', filename='img/pizzas/logo.png') }}" alt="Logo Benedetto Pizza">
            <span class="ml-2 text-zinc-700 truncate">Benedetto</span>
        </div>

        <!-- Menú hamburguesa (móvil) - reposicionado y mejorado -->
        <button id="menu-toggle"
            class="md:hidden flex items-center justify-center w-10 h-10 text-2xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-200 rounded-md"
            aria-label="Abrir menú">
            &#9776;
        </button>

        <!-- Navbar en pantallas grandes -->
        <nav class="hidden md:flex font-roboto text-gray-600 drop-shadow-md">
            <ul class="flex flex-row justify-center items-center space-x-4 lg:space-x-8">
                <li><a href="/dashboard/"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Dashboard</a>
                </li>

                <li><a href="/dashboard/empleados"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Empleados</a>
                </li>
                <li><a href="/dashboard/clientes"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Clientes</a>
                </li>
                <li><a href="/dashboard/sucursales"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Sucursales</a>
                </li>
                <li><a href="/dashboard/categorias"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Categorias</a>
                </li>
                <li><a href="/dashboard/form_ventas"
                        class="text-sm lg:text-base py-1 border-b-2 border-transparent hover:border-red-600 transition-all duration-300 ease-in-out">Ventas</a>
                </li>


                <!-- Dropdown de Usuario (gestionado por dropdown.js) -->
                <li class="relative popup">
                    <!-- Botón para abrir el dropdown -->
                    <button id="user-menu-button" class="user-btn p-2 rounded-full hover:bg-gray-100"
                        aria-label="Menú de usuario" aria-expanded="false" aria-haspopup="true">
                        <i class="fa-regular fa-user"></i>
                    </button>

                    <!-- Contenido del Dropdown -->
                    <div id="user-menu"
                        class="hidden popup-window absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg font-roboto z-50">
                        <ul class="py-2 text-gray-700">
                            <li class="hover:bg-gray-200">
                                <button onclick="location.href='/perfil'"
                                    class="block w-full text-left px-4 py-2">Perfil</button>
                            </li>
                            <li class="hover:bg-gray-200">
                                <button onclick="location.href='/configuracion'"
                                    class="block w-full text-left px-4 py-2">Configuración</button>
                            </li>
                            <hr class="text-gray-300">
                            <li class="hover:bg-gray-200">
                                <a href="{{ url_for('auth_bp.logout' ) }}"
                                    class="block w-full text-left px-4 py-2 text-red-600">Cerrar sesión</a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Navbar en móviles - mejorado -->
    <nav id="menu"
        class="hidden md:hidden fixed top-0 left-0 w-full h-screen bg-white shadow-md z-50 transform transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="flex justify-between items-center p-4 border-b border-gray-200">
            <div class="flex items-center">
                <img class="h-8 w-8 object-contain" src="{{ url_for('static', filename='img/pizzas/logo.png') }}"
                    alt="Logo">
                <span class="ml-2 font-roboto font-semibold">Benedetto Pizza</span>
            </div>
            <button id="close-menu"
                class="text-2xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-200 rounded-md p-1"
                aria-label="Cerrar menú">
                &times;
            </button>
        </div>
        <ul class="flex flex-col p-4 space-y-4">
            <li>
                <a href="/dashboard/"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Dashboard</a>
            </li>
            <li>
                <a href="/dashboard/categorias"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Categorias</a>
            </li>
            <li>
                <a href="/dashboard/empleados"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Empleados</a>
            </li>
            <li>
                <a href="/dashboard/clientes"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Clientes</a>
            </li>
            <li>
                <a href="/dashboard/sucursales"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Sucursales</a>
            </li>
            <li>
                <a href="/dashboard/carta_pizza"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Pizzas</a>
            </li>
            <li class="border-t border-gray-200 pt-4 mt-4">
                <a href="/perfil"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Perfil</a>
            </li>

            <li>
                <a href="/configuracion"
                    class="block py-2 px-4 rounded-md hover:bg-red-50 hover:text-red-600 transition-colors">Configuración</a>
            </li>
            <li>
                <a href="{{ url_for('auth_bp.logout' ) }}"
                    class="block py-2 px-4 rounded-md text-red-600 hover:bg-red-50 transition-colors">Cerrar sesión</a>
            </li>
        </ul>
    </nav>
</header>
