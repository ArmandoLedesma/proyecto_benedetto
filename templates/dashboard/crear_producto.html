{% extends 'base.html' %}

{% block content %}

{% include 'headerd.html' %}

<!-- Contenido -->
<div class="flex flex-col items-center w-full rounded-lg p-4 sm:p-6 md:p-8 font-roboto">
    <!--! Contenedor principal - Ajustado para ser responsivo en móviles -->
    <div class="flex bg-white rounded-lg overflow-hidden mx-auto w-full max-w-xl my-auto shadow-xl">
        <div class="w-full p-4 sm:p-6 md:p-8 flex flex-col">
            <div class="container flex flex-col max-w-md mx-auto w-full">
                <!--! Volver - Ajustado para mejor área táctil -->
                <a href="{{ url_for('auth_bp.login') }}" class="flex items-center text-gray-900 group py-2">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5 mr-1 transition-transform transform group-hover:-translate-x-1"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 5 5 12 12 19"></polyline>
                    </svg>
                    <span class="transition-all group-hover:font-semibold">Login</span>
                </a>
                <h2 class="text-xl sm:text-2xl font-semibold text-zinc-800 text-center mt-2">Benedetto Pizza</h2>
                <div class="flex justify-center m-2">
                    <img src="{{ url_for('static', filename='img/pizzas/logo.png') }}" alt="Logo"
                        class="w-18 h-18 sm:w-12 sm:h-12">
                </div>
                <p class="text-lg sm:text-xl text-gray-800 text-center">Crea tu cuenta</p>

                <!--! Inicio del formulario -->
                <form id="registerForm" method="POST" action="{{ url_for('auth_bp.registrarse') }}">
                    <div class="mt-4">
                        <label class="block text-negro text-sm font-bold mb-2">Nombres y apellidos:</label>
                        <input
                            class="bg-gray-200 text-negro focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                            type="text" placeholder="Ingresa tus nombres" name="nombre" id="nombre" />
                    </div>

                    <!-- <div class="mt-4">
                      <label class="block text-negro text-sm font-bold mb-2">
                        Apellidos:
                      </label>
                      <input
                        class="bg-gray-200 text-negro focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" placeholder="Ingresa tus apellidos" />
                    </div> -->
                    <!--! Input para el correo electronico -->
                    <div class="mt-4">
                        <label class="block font-medium text-sm mb-2">
                            Correo electrónico
                        </label>
                        <input id="email" name="email" required
                            class="bg-gray-200 text-negro focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                            type="email" placeholder="Email" />
                        <!-- Mensaje de error -->
                        <p id="email-error" class="text-sm text-red-500 hidden">Ingrese un email válido.</p>
                    </div>
                    <!--! Input para la contraseña -->
                    <div class="relative mt-4">
                        <div class="flex justify-between">
                            <label class="block text-negro text-sm font-bold mb-2">
                                Contraseña
                            </label>
                        </div>
                        <input name="password" id="password"
                            class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                            type="password" placeholder="Password" />

                        <!--! Mensaje de advertencia en caso de que las contraseñas no coincidan  -->
                        <span id="passwordError" class="text-red-600 text-sm mt-1 hidden">
                            Las contraseñas no coinciden
                            <i class="fa-solid fa-xmark"></i>
                        </span>

                        <!--! Mensaje de exito en caso de que las contraseñas coincidan -->
                        <span id="passwordSuccess" class="text-primary text-sm mt-1 hidden">
                            Las contraseñas coinciden
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <!-- Icono para mostrar y ocultar la contraseña escrita -->
                        <span id="toggle-password"
                            class="absolute inset-y-0 top-7 right-3 flex items-center cursor-pointer text-gray-500">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>

                    <!--! Input para la confirmación de la contraseña ingresada -->
                    <div class="relative mt-4">
                        <div class="flex justify-between">
                            <label class="block text-negro text-sm font-bold mb-2">Confirmar Contraseña</label>
                        </div>
                        <input id="confirmPassword" name="confirmPassword" required
                            class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                            type="password" placeholder="Password" />

                        <!--! Icono para mostrar y ocultar la confirmación de la contraseña escrita -->
                        <span id="toggle-confirmPassword"
                            class="absolute inset-y-0 top-7 right-3 flex items-center cursor-pointer text-gray-500">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>

                    <!--! Boton para crear la cuenta - Ajustado para mejor área táctil -->
                    <div class="mt-6 sm:mt-8">
                        <button type="submit" id="submitButton" class="button w-full py-2.5 sm:py-3" disabled>
                            Crear cuenta
                        </button>
                    </div>
                    <!--! Regresar al login - Ajustado espaciado -->
                    <div class="mt-4 sm:mt-6 text-center text-sm text-gray-700">
                        ¿Ya tienes una cuenta?
                        <a href="{{ url_for('auth_bp.login') }}"
                            class="text-gray-800 hover:text-red-600 font-medium transition">Iniciar
                            sesión</a>
                    </div>
            </div>

            </form>

        </div>

    </div>
</div>

{% include 'footer.html' %}
{% endblock %}
