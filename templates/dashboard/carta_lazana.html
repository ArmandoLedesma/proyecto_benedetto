{% extends 'base.html' %}

{% block content %}

{% include 'headerd.html' %}

<!-- Contenido -->
<main class="relative px-3 sm:px-4 md:px-6 lg:px-8">

    <!-- Boton flotante para crear -->
    {% include 'modal-productos.html' %}

    <!-- Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-6 sm:mt-8 font-roboto">
        {% for item in items %}
        <div
            class="card card-animated w-full rounded-lg overflow-hidden shadow-md hover:shadow-lg transition-shadow duration-300 flex flex-col h-auto sm:h-[400px] md:h-[380px]">
            <!-- Imagen con tamaño fijo preservando la estructura original -->
            <div class="relative w-full h-44 card-image">
                {% if item.image %}
                <img class="w-full h-full object-cover" src="{{ url_for('static', filename=item.image) }}"
                    alt="{{ item.nombre }}">
                {% else %}
                <img class="w-full h-full object-cover" src="{{ url_for('static', filename='img/default_image.png') }}"
                    alt="Imagen por defecto">
                {% endif %}
            </div>

            <!-- Contenido de la card con mejor estructura -->
            <div class="p-3 sm:p-4 flex-1 flex flex-col">
                <!-- Sección superior con título y descripción -->
                <div class="flex-1 min-h-0">
                    <h3 class="text-base sm:text-lg font-semibold text-gray-800 card-title mb-1 line-clamp-2">{{ item.nombre }}</h3>
                    <p class="text-xs sm:text-sm text-gray-600 line-clamp-3 mt-1">{{ item.description }}</p>
                </div>
                
                <!-- Sección inferior con precio y botón - mejorado para evitar superposición -->
                <div class="flex items-center justify-between mt-4">
                    <span class="text-base sm:text-lg font-bold text-red-600 card-price mr-2">${{ item.precio }}</span>
                    <button class="button py-1 px-2 sm:py-2 sm:px-3 text-xs sm:text-sm whitespace-nowrap">Comprar ahora</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</main>

{% include 'footer.html' %}
{% endblock %}
