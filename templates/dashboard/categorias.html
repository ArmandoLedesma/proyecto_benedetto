{% extends 'base.html' %}

{% block content %}

{% include 'headerd.html' %}

<!-- Contenido -->
<main>

    <!-- Tarjeta -->
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap -mx-2 sm:-mx-3 md:-mx-4">
            {% for item in items %}
            <div class="w-full sm:w-1/2 md:w-1/2 lg:w-1/3 xl:w-1/4 p-2 sm:p-3 md:p-4 {% if loop.last and (items|length % 4 != 0 and screen_size == 'xl') or (items|length % 3 != 0 and screen_size == 'lg') or (items|length % 2 != 0 and screen_size == 'sm') %}mx-auto{% endif %}">
                <div class="h-full rounded-lg overflow-hidden shadow-lg bg-white hover:shadow-xl transition-shadow duration-300 flex flex-col">
                    <div class="relative pt-[56.25%] overflow-hidden">
                        <img class="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-300 hover:scale-105"
                            src="{{ url_for('static', filename=item.image) }}" 
                            alt="{{ item.title }}"
                            loading="lazy">
                    </div>
                    <div class="px-4 sm:px-5 py-3 sm:py-4 font-roboto flex-grow">
                        <h2 class="text-lg sm:text-xl mb-2 text-zinc-800 font-medium">{{ item.title }}</h2>
                        <p class="text-gray-700 text-sm sm:text-base text-balance">{{ item.description }}</p>
                    </div>
                    <div class="px-4 sm:px-5 py-3 sm:py-4 mt-auto">
                        <a href="{{ item.url|default('#') }}" class="inline-block w-full text-center px-4 py-2 button">
                            {{ item.button_text|default('Ver más') }}
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Tarjeta Fin -->

    {% include 'footer.html' %}

</main>
{% endblock %}
